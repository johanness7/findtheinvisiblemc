<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindTheInvisibleMC</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bg: #ffffff; --text: #000000; --danger: #ff4444; --success: #2ecc71; }
        
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; width: 100vw; overflow: hidden; }
        
        #main-wrapper { width: 100%; height: 100%; transition: filter 0.4s ease; position: relative; }
        .blurred { filter: blur(15px) grayscale(20%); pointer-events: none; }

        #achievement { position: absolute; top: 40px; left: -550px; background: #000; color: #fff; padding: 15px 30px; font-weight: 900; font-size: 0.8rem; letter-spacing: 1px; z-index: 2500; transition: left 0.6s cubic-bezier(0.19, 1, 0.22, 1); border-radius: 0 4px 4px 0; text-transform: uppercase; }
        
        .header { position: absolute; top: 0; width: 100%; padding: 40px; display: flex; justify-content: space-between; box-sizing: border-box; z-index: 10; pointer-events: none; }
        
        #logo-link { font-weight: 900; font-size: 1.3rem; pointer-events: auto; cursor: pointer; transition: opacity 0.2s; }
        #logo-link:hover { opacity: 0.7; }

        .stats { 
            font-weight: 900; 
            color: #000; 
            pointer-events: auto; 
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5); 
        }
        .stats span:first-child { color: #888; margin-right: 5px; }
        .stat-val { font-size: 1.4rem; vertical-align: middle; }
        
        #sound-warning { color: var(--danger); font-weight: 900; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; animation: pulse 2s infinite; text-align: center; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #pause-btn { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; border: none; padding: 10px 25px; font-weight: 900; font-size: 0.7rem; letter-spacing: 2px; border-radius: 4px; cursor: pointer; z-index: 500; display: none; }
        
        #game-screen { width: 100vw; height: 100vh; position: relative; cursor: none; }
        #cursor-ring { width: 18px; height: 18px; border: 2px solid #000; border-radius: 50%; position: absolute; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
        
        #target-item { position: absolute; width: 80px; height: 80px; display: none; z-index: 50; transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1); pointer-events: none; object-fit: contain; }
        .found-anim { left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) scale(4) rotate(360deg) !important; }
        
        #overlay, #pause-overlay, #confirm-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #confirm-overlay { display: none; z-index: 6000; background: rgba(255, 255, 255, 0.95); }
        
        .menu-container { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 400px; text-align: center; }
        
        .btn-hover-effect { transition: transform 0.2s ease-out; cursor: pointer; }
        .btn-hover-effect:hover { transform: scale(1.05) rotate(2deg); }

        .btn-main { background: #000; color: #fff; border: none; padding: 22px 70px; font-size: 1.1rem; font-weight: 900; border-radius: 4px; width: 85%; }
        .btn-secondary { background: transparent; color: #000; border: 3px solid #000; padding: 12px 30px; font-size: 0.85rem; font-weight: 900; border-radius: 4px; text-transform: uppercase; width: 85%; }

        .btn-reset { background: var(--danger); color: #fff; border: none; padding: 12px 30px; font-size: 0.8rem; font-weight: 900; border-radius: 4px; text-transform: uppercase; width: 60%; margin-top: 60px; opacity: 1; box-shadow: 0 4px 10px rgba(255, 68, 68, 0.3); }
        .btn-reset:hover { background: #e03333; }
        
        .mission-status { font-size: 0.75rem; font-weight: 900; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-top: 25px; }
        .mission-hint { font-size: 0.6rem; color: #ff4444; font-weight: 900; margin-top: 5px; display: none; }
        
        #wheel-container { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5000; }
        .wheel-base { position: relative; width: 450px; height: 450px; border-radius: 50%; border: 6px solid #000; background: rgba(255,255,255,0.95); box-shadow: 0 0 50px rgba(0,0,0,0.15); }
        .wheel-slot { position: absolute; width: 95px; height: 95px; margin-left: -47px; margin-top: -47px; left: 50%; top: 50%; background: #fff; border: 4px solid #000; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .wheel-slot img { width: 80%; height: 80%; object-fit: contain; image-rendering: auto; }
        .wheel-slot.active { border-width: 8px; transform: scale(1.1); background: #f8f8f8; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="achievement">ACHIEVEMENT!</div>
        <button id="pause-btn" onclick="pauseGame()">PAUSE</button>

        <div class="header">
            <div id="logo-link" onclick="location.reload()">FindTheInvisibleMC</div>
            <div class="stats"><span>TOTAL:</span> <span id="count" class="stat-val">0</span></div>
        </div>

        <div id="game-screen">
            <div id="cursor-ring"></div>
            <img id="target-item" src="anvil.png" alt="Target">
        </div>

        <div id="overlay">
            <div class="menu-container">
                <div id="sound-warning">⚠️ MAKE SURE YOUR SOUND IS ON! ⚠️</div>
                <button class="btn-secondary btn-hover-effect" onclick="toggleWheel(true)">Collection</button>
                <button class="btn-main btn-hover-effect" id="action-btn" onclick="initGame()">START</button>
                
                <div class="mission-status" id="mission-text">MISSION: ANVIL 0/5</div>
                <div class="mission-hint" id="hint-text">WRONG CHARACTER EQUIPPED!</div>
                
                <button class="btn-reset btn-hover-effect" onclick="showResetConfirm()">RESET PROGRESS</button>
            </div>
        </div>

        <div id="pause-overlay" style="display:none;">
            <div class="menu-container">
                <h1 style="font-weight: 900; letter-spacing: 5px;">PAUSED</h1>
                <button class="btn-main btn-hover-effect" onclick="resumeGame()">RESUME</button>
            </div>
        </div>
    </div>

    <div id="confirm-overlay">
        <div class="menu-container">
            <h1 style="font-weight: 900; color: var(--danger);">ARE YOU SURE?</h1>
            <p style="font-weight: 700; color: #888;">ALL YOUR PROGRESS WILL BE LOST FOREVER.</p>
            <button class="btn-main btn-hover-effect" style="background: var(--danger);" onclick="confirmReset()">YES, DELETE EVERYTHING</button>
            <button class="btn-secondary btn-hover-effect" onclick="hideResetConfirm()">NO, TAKE ME BACK</button>
        </div>
    </div>

    <div id="wheel-container" onclick="toggleWheel(false)">
        <div class="wheel-base" id="wheel-inner"></div>
    </div>

    <script>
        const wrapper = document.getElementById('main-wrapper');
        const target = document.getElementById('target-item');
        const overlay = document.getElementById('overlay');
        const pauseOverlay = document.getElementById('pause-overlay');
        const confirmOverlay = document.getElementById('confirm-overlay');
        const pauseBtn = document.getElementById('pause-btn');
        const btn = document.getElementById('action-btn');
        const countEl = document.getElementById('count');
        const missionText = document.getElementById('mission-text');
        const hintText = document.getElementById('hint-text');
        const achievement = document.getElementById('achievement');
        const wheelInner = document.getElementById('wheel-inner');
        const wheelContainer = document.getElementById('wheel-container');
        const cursor = document.getElementById('cursor-ring');

        let totalScore = parseInt(localStorage.getItem('mc_total_score')) || 0;
        let missionScore = parseInt(localStorage.getItem('mc_mission_score')) || 0;
        let currentCharacter = localStorage.getItem('mc_char') || 'anvil.png';
        
        let tX, tY, mX = 0, mY = 0;
        let isPlaying = false;
        let isPaused = false;
        let soundTimer;
        let soundsReady = false;
        
        const characters = ['anvil.png', 'creeper.png', 'sand.png', 'sheep.png', 'slime.png', 'pig.png', 'amethyst.png', 'goat.png', 'beacon.png'];
        const audioLibrary = {};

        characters.forEach(char => {
            const a = new Audio(char.replace('.png', '.mp3'));
            a.preload = 'auto';
            audioLibrary[char] = a;
        });

        const achievements = {
            5: "Anvils Done!", 10: "Creeper Master!", 15: "Sand Survivor!", 
            20: "Sheep Shepherd!", 25: "Slime Jumper!", 30: "Piggy Tamer!", 
            35: "Crystal Clear!", 40: "G.O.A.T!", 45: "Beacon God!"
        };

        function getRequiredChar() {
            let index = Math.floor(missionScore / 5);
            if (index >= characters.length) return null; 
            return characters[index];
        }

        function updateUI() {
            countEl.innerText = totalScore;
            localStorage.setItem('mc_total_score', totalScore);
            localStorage.setItem('mc_mission_score', missionScore);
            const reqChar = getRequiredChar();
            if (reqChar === null) {
                missionText.innerText = "MISSIONS COMPLETED!";
                missionText.style.color = "var(--success)"; 
                hintText.style.display = "none";
            } else {
                const phaseProgress = missionScore % 5;
                missionText.innerText = `MISSION: ${reqChar.split('.')[0].toUpperCase()} ${phaseProgress}/5`;
                missionText.style.color = "#888";
                hintText.style.display = (currentCharacter !== reqChar) ? "block" : "none";
            }
            target.src = currentCharacter;
        }

        function toggleWheel(show) {
            if (show) { 
                wheelContainer.style.display = 'flex'; 
                wrapper.classList.add('blurred');
                generateWheel(); 
            } else { 
                wheelContainer.style.display = 'none'; 
                wrapper.classList.remove('blurred');
            }
        }

        function generateWheel() {
            wheelInner.innerHTML = '';
            const unlockedCount = Math.min(characters.length, Math.floor(missionScore / 5) + 1);
            const radius = 170;
            for (let i = 0; i < unlockedCount; i++) {
                const angle = (i / unlockedCount) * (Math.PI * 2) - (Math.PI / 2);
                const x = Math.cos(angle) * radius + 225;
                const y = Math.sin(angle) * radius + 225;
                const slot = document.createElement('div');
                slot.className = 'wheel-slot';
                if(characters[i] === currentCharacter) slot.classList.add('active');
                slot.style.left = x + 'px'; slot.style.top = y + 'px';
                slot.innerHTML = `<img src="${characters[i]}" alt="char">`;
                slot.onclick = (e) => {
                    e.stopPropagation();
                    currentCharacter = characters[i];
                    localStorage.setItem('mc_char', currentCharacter);
                    updateUI(); 
                    toggleWheel(false);
                };
                wheelInner.appendChild(slot);
            }
        }

        function showResetConfirm() {
            confirmOverlay.style.display = 'flex';
            wrapper.classList.add('blurred');
        }
        function hideResetConfirm() {
            confirmOverlay.style.display = 'none';
            wrapper.classList.remove('blurred');
        }
        function confirmReset() {
            localStorage.clear();
            location.reload();
        }

        function showAchievement(text) {
            achievement.innerText = `ACHIEVEMENT: ${text}`;
            achievement.style.left = "0px";
            setTimeout(() => { achievement.style.left = "-550px"; }, 4000);
        }

        function pauseGame() {
            if (!isPlaying) return;
            isPaused = true; isPlaying = false;
            clearTimeout(soundTimer);
            pauseOverlay.style.display = 'flex'; pauseBtn.style.display = 'none';
        }

        function resumeGame() {
            isPaused = false; isPlaying = true;
            pauseOverlay.style.display = 'none'; pauseBtn.style.display = 'block';
            gameLoop();
        }

        function initGame() {
            if(!soundsReady) {
                Object.values(audioLibrary).forEach(s => {
                    s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {});
                });
                soundsReady = true;
            }
            const reqChar = getRequiredChar();
            if (reqChar && currentCharacter !== reqChar && missionScore % 5 === 0) {
                currentCharacter = reqChar;
                localStorage.setItem('mc_char', currentCharacter);
            }
            overlay.style.display = 'none'; pauseBtn.style.display = 'block';
            target.classList.remove('found-anim'); target.style.display = 'none';
            isPlaying = true; isPaused = false; updateUI();
            tX = Math.random() * (window.innerWidth - 200) + 100;
            tY = Math.random() * (window.innerHeight - 200) + 100;
            target.style.left = tX + 'px'; target.style.top = tY + 'px';
            gameLoop();
        }

        window.addEventListener('mousemove', (e) => {
            mX = e.clientX; mY = e.clientY;
            cursor.style.left = mX + 'px'; cursor.style.top = mY + 'px';
        });

        function gameLoop() {
            if (!isPlaying || isPaused) return;
            const dist = Math.sqrt(Math.pow(mX-tX, 2) + Math.pow(mY-tY, 2));
            const maxDist = Math.sqrt(window.innerWidth**2 + window.innerHeight**2);
            const currentAudio = audioLibrary[currentCharacter];
            if (currentAudio) {
                currentAudio.volume = Math.max(0.05, Math.min(1, 1 - (dist / (maxDist * 0.45))));
                currentAudio.currentTime = 0;
                currentAudio.play().catch(() => {});
            }
            soundTimer = setTimeout(gameLoop, Math.max(120, dist * 1.4));
        }

        window.addEventListener('mousedown', (e) => {
            if (!isPlaying || isPaused || overlay.style.display !== 'none' || e.target.id === 'pause-btn' || confirmOverlay.style.display === 'flex') return;
            const dist = Math.sqrt(Math.pow(mX-tX, 2) + Math.pow(mY-tY, 2));
            if (dist < 60) {
                isPlaying = false; pauseBtn.style.display = 'none';
                clearTimeout(soundTimer);
                totalScore++; 
                const reqChar = getRequiredChar();
                if (reqChar === null || currentCharacter === reqChar) {
                    missionScore++;
                    if(achievements[missionScore]) showAchievement(achievements[missionScore]);
                }
                updateUI();
                target.style.display = 'block';
                setTimeout(() => target.classList.add('found-anim'), 50);
                const winSnd = audioLibrary[currentCharacter];
                if (winSnd) { winSnd.volume = 1; winSnd.play().catch(() => {}); }
                setTimeout(() => { overlay.style.display = 'flex'; btn.innerText = "CONTINUE"; }, 2000);
            }
        });

        updateUI();
    </script>
</body>
</html>
